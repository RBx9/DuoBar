name: Build DuoBar Hotspot Beta

on:
  push:
    branches: [fix/hotspot-inside-circle-v0.2.4-beta1]
    paths: ['.github/workflows/hotspot-beta.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.scheme }} hotspot beta
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scheme: [roothide, rootless]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install make ldid dpkg gnu-tar xz rsync
      - name: Configure Theos
        run: |
          echo "THEOS=$RUNNER_TEMP/duobar-theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Fetch Theos and SDK
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          if [ "$SCHEME" = roothide ]; then
            git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          else
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/duobar-sdks"
          git -C "$RUNNER_TEMP/duobar-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Compile and inspect package
        shell: bash
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          if [ "$SCHEME" = rootless ]; then
            cp packaging/control.rootless control
            package_id=local.duobar.rootless
            arch=iphoneos-arm64
            prefix=var/jb/
            suffix=Rootless
            export ARCHS=arm64
          else
            package_id=local.duobar
            arch=iphoneos-arm64e
            prefix=
            suffix=RootHide
          fi
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME="$SCHEME" TARGET=iphone:clang:16.5:16.0
          files=(packages/*.deb)
          test "${#files[@]}" -eq 1
          deb="${files[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "$package_id"
          test "$(dpkg-deb -f "$deb" Version)" = "0.2.4~beta1"
          test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
          dpkg-deb --contents "$deb" | tee contents.txt
          grep -Fq "${prefix}Library/MobileSubstrate/DynamicLibraries/DuoBar.dylib" contents.txt
          grep -Fq "${prefix}Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBarIcon.png" contents.txt
          grep -Fq "${prefix}Library/PreferenceLoader/Preferences/DuoBar.plist" contents.txt
          cp "$deb" "DuoBar_0.2.4-beta1_${suffix}.deb"
          shasum -a 256 "DuoBar_0.2.4-beta1_${suffix}.deb" > "SHA256SUMS-${suffix}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: DuoBar-hotspot-beta-${{ matrix.scheme }}
          path: |
            DuoBar_0.2.4-beta1_*.deb
            SHA256SUMS-*.txt
          if-no-files-found: error

  publish-test:
    name: Publish GitHub prerelease only
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DuoBar-hotspot-beta-*
          path: beta
          merge-multiple: true
      - name: Check both installers and publish test-only assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd beta
          test -f DuoBar_0.2.4-beta1_RootHide.deb
          test -f DuoBar_0.2.4-beta1_Rootless.deb
          sha256sum -c SHA256SUMS-RootHide.txt
          sha256sum -c SHA256SUMS-Rootless.txt
          if gh release view v0.2.4-beta.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create v0.2.4-beta.1 \
            DuoBar_0.2.4-beta1_RootHide.deb DuoBar_0.2.4-beta1_Rootless.deb \
            SHA256SUMS-RootHide.txt SHA256SUMS-Rootless.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DuoBar v0.2.4 beta 1 — Hotspot indicator" \
            --notes-file ../docs/TEST-v0.2.4-beta1.md --prerelease
