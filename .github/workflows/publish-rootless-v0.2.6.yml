name: Publish DuoBar Rootless v0.2.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rootless-v0.2.6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-rootless:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install standard Rootless toolchain prerequisites
        run: brew install make ldid dpkg gnu-tar xz rsync
      - name: Configure standard Theos
        run: |
          echo "THEOS=$RUNNER_TEMP/duobar-theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Download standard Theos and iOS 16.5 SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/duobar-sdks"
          git -C "$RUNNER_TEMP/duobar-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Compile and verify Rootless package
        shell: bash
        run: |
          set -euo pipefail
          # The RootHide control file is untouched in the repository.
          cp packaging/control.rootless control
          test "$(sed -n 's/^Version: //p' control)" = "0.2.6"
          grep -Fq 'Rmbx998@gmail.com' duobarprefs/DuoRootListController.m
          grep -Fq 'Report a Bug' duobarprefs/DuoRootListController.m
          grep -Fq 'Help Test Other iOS Versions' duobarprefs/DuoRootListController.m
          if grep -Eiq 'paypal|donat|support via paypal' docs/RELEASE-v0.2.6-rootless.md; then
            echo "Support must not be advertised in What's New" >&2
            exit 1
          fi
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64 TARGET=iphone:clang:16.5:16.0
          files=(packages/*.deb)
          test "${#files[@]}" -eq 1
          deb="${files[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "local.duobar.rootless"
          test "$(dpkg-deb -f "$deb" Version)" = "0.2.6"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          dpkg-deb --contents "$deb" | tee package-contents.txt
          grep -Fq 'var/jb/Library/MobileSubstrate/DynamicLibraries/DuoBar.dylib' package-contents.txt
          grep -Fq 'var/jb/Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBarIcon.png' package-contents.txt
          grep -Fq 'var/jb/Library/PreferenceLoader/Preferences/DuoBar.plist' package-contents.txt
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root=Path('extracted/var/jb/Library')
          pref=root/'PreferenceLoader/Preferences'
          bundle=root/'PreferenceBundles/DuoBarPrefs.bundle'
          required=[pref/n for n in ('DuoBar.png','DuoBar@2x.png','DuoBar@3x.png')]
          required += [bundle/n for n in ('DuoBar.png','DuoBar@2x.png','DuoBar@3x.png','DuoBarIcon.png')]
          for icon in required:
              data=icon.read_bytes()
              assert data[:8] == bytes.fromhex('89504e470d0a1a0a'), icon
              assert data[25] == 6, f'{icon} is not an RGBA icon'
          assert plistlib.loads((pref/'DuoBar.plist').read_bytes())['entry']['icon']=='DuoBar.png'
          assert plistlib.loads((bundle/'Info.plist').read_bytes())['CFBundleShortVersionString']=='0.2.6'
          print('Verified 0.2.6 Rootless icon, Settings, layout and version')
          PY
          cp "$deb" DuoBar_0.2.6_Rootless.deb
          shasum -a 256 DuoBar_0.2.6_Rootless.deb > SHA256SUMS-rootless.txt
      - name: Upload verified Rootless installer
        uses: actions/upload-artifact@v4
        with:
          name: DuoBar-v0.2.6-Rootless-verified
          path: |
            DuoBar_0.2.6_Rootless.deb
            SHA256SUMS-rootless.txt
          if-no-files-found: error

  publish-rootless:
    needs: verify-rootless
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DuoBar-v0.2.6-Rootless-verified
          path: .
      - name: Check verified artifact and publish separate Rootless release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f DuoBar_0.2.6_Rootless.deb
          sha256sum -c SHA256SUMS-rootless.txt
          test "$(dpkg-deb -f DuoBar_0.2.6_Rootless.deb Package)" = 'local.duobar.rootless'
          test "$(dpkg-deb -f DuoBar_0.2.6_Rootless.deb Version)" = '0.2.6'
          test "$(dpkg-deb -f DuoBar_0.2.6_Rootless.deb Architecture)" = 'iphoneos-arm64'
          if gh release view v0.2.6-rootless.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Rootless release already exists; not overwriting installer" >&2
            exit 1
          fi
          gh release create v0.2.6-rootless.1 \
            DuoBar_0.2.6_Rootless.deb SHA256SUMS-rootless.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DuoBar (Rootless) v0.2.6 — Initial iOS 16 Build" \
            --notes-file docs/RELEASE-v0.2.6-rootless.md --prerelease
