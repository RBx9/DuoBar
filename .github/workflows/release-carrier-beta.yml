name: DuoBar carrier beta (RootHide + Rootless)

# Branch pushes build both packages with the official Theos toolchains on
# GitHub's macOS runners, verify them with scripts/verify-deb.py, and upload
# them as workflow artifacts only. A GitHub prerelease is created only when a
# v2.7.2-beta.N tag matching the package version is pushed deliberately, or
# when a manual run asks for it, and never over an existing release. Stable
# releases and the Sileo source are not touched by this workflow.
on:
  push:
    branches:
      - feature/carrier-5g-lte-v2.7.2-beta1
      - claude/duobar-development-2iw4np
    tags:
      - 'v2.7.2-beta.*'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: Publish the verified packages as a GitHub prerelease (never a full, stable or Sileo release)
        type: boolean
        default: false
      publish_stable:
        description: Publish a stable version (no ~beta suffix) as the latest full GitHub release; Sileo is updated separately
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify RootHide and Rootless packages
    runs-on: macos-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      file_version: ${{ steps.version.outputs.file_version }}
      tag: ${{ steps.version.outputs.tag }}
      stable: ${{ steps.version.outputs.stable }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - name: Read and cross-check the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          test "$(sed -n 's/^Version: //p' packaging/control.rootless)" = "$version"
          # Either a beta (2.7.2~beta8) or a stable version (2.7.2).
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(~beta([0-9]+))?$ ]]
          base="${BASH_REMATCH[1]}"
          beta="${BASH_REMATCH[3]}"
          if [ -n "$beta" ]; then
            display="$base-beta.$beta"; file="$base-beta$beta"; tag="v$base-beta.$beta"
          else
            display="$base"; file="$base"; tag="v$base"
          fi
          grep -Fq "DUO_VERSION @\"$display\"" Shared/DuoMetadata.h
          python3 -I -c 'import plistlib, sys; assert plistlib.load(open(sys.argv[1], "rb"))["CFBundleShortVersionString"] == sys.argv[2]' \
            duobarprefs/Resources/Info.plist "$base"
          {
            echo "version=$version"
            echo "file_version=$file"
            echo "tag=$tag"
            echo "stable=$([ -n "$beta" ] && echo false || echo true)"
            echo "artifact=DuoBar-$file-${GITHUB_SHA::12}"
          } >> "$GITHUB_OUTPUT"

      - name: Check private API safety
        run: python3 -I scripts/check-private-api.py

      - name: Run the glyph layout tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cc -std=c99 -Wall -Wextra -Werror tests/layout-test.c -lm -o "$RUNNER_TEMP/layout-test"
          "$RUNNER_TEMP/layout-test" | tee dist/layout-test.txt

      - name: Install build prerequisites
        run: brew install make ldid dpkg gnu-tar xz rsync

      - name: Configure Theos
        run: |
          echo "THEOS=$RUNNER_TEMP/duobar-theos-roothide" >> "$GITHUB_ENV"
          echo "THEOS_ROOTLESS=$RUNNER_TEMP/duobar-theos-rootless" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Fetch RootHide and standard Theos with iOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS_ROOTLESS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/duobar-sdks"
          git -C "$RUNNER_TEMP/duobar-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks" "$THEOS_ROOTLESS/sdks" dist
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS_ROOTLESS/sdks/"
          {
            echo "RootHide Theos $(git -C "$THEOS" rev-parse HEAD)"
            echo "Theos $(git -C "$THEOS_ROOTLESS" rev-parse HEAD)"
            echo "Theos SDKs $(git -C "$RUNNER_TEMP/duobar-sdks" rev-parse HEAD) (iPhoneOS16.5.sdk)"
            xcrun clang --version | head -n 1
          } | tee dist/toolchain.txt

      - name: Build the RootHide package
        shell: bash
        env:
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: |
          set -euo pipefail
          umask 022
          mkdir -p "$RUNNER_TEMP/roothide-packages"
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:16.5:16.0 \
            THEOS_PACKAGE_DIR="$RUNNER_TEMP/roothide-packages" 2>&1 | tee dist/build-RootHide.log
          files=("$RUNNER_TEMP/roothide-packages"/*.deb)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" "dist/DuoBar_${FILE_VERSION}_RootHide.deb"

      - name: Build the Rootless package with both device slices
        shell: bash
        env:
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: |
          set -euo pipefail
          umask 022
          cp control "$RUNNER_TEMP/roothide-control"
          trap 'cp "$RUNNER_TEMP/roothide-control" control' EXIT
          cp packaging/control.rootless control
          mkdir -p "$RUNNER_TEMP/rootless-packages"
          THEOS="$THEOS_ROOTLESS" gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless \
            ARCHS='arm64 arm64e' TARGET=iphone:clang:16.5:16.0 \
            THEOS_PACKAGE_DIR="$RUNNER_TEMP/rootless-packages" 2>&1 | tee dist/build-Rootless.log
          files=("$RUNNER_TEMP/rootless-packages"/*.deb)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" "dist/DuoBar_${FILE_VERSION}_Rootless.deb"

      - name: Verify package metadata, modes, slices, linkage and build logs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FILE_VERSION: ${{ steps.version.outputs.file_version }}
        run: |
          set -euo pipefail
          for variant in RootHide Rootless; do
            scheme="$(tr '[:upper:]' '[:lower:]' <<< "$variant")"
            deb="dist/DuoBar_${FILE_VERSION}_${variant}.deb"
            python3 -I scripts/verify-deb.py --scheme "$scheme" --version "$VERSION" \
              --build-log "dist/build-${variant}.log" "$deb" | tee -a dist/verification.txt
            dpkg-deb --info "$deb" > "dist/info-${variant}.txt"
            dpkg-deb --contents "$deb" | tee "dist/contents-${variant}.txt"
            # Cross-check the slices with Apple's lipo, independently of the script.
            extracted="$RUNNER_TEMP/extracted-${variant}"
            dpkg-deb --extract "$deb" "$extracted"
            while IFS= read -r binary; do
              archs="$(xcrun lipo -archs "$binary")"
              echo "${binary#"$extracted"/}: $archs" | tee -a dist/verification.txt
              test "$(tr ' ' '\n' <<< "$archs" | sort | xargs)" = "arm64 arm64e"
            done < <(find "$extracted" -type f \( -name DuoBar.dylib -o -name DuoBarPrefs \))
          done
          # Prove the verifier still rejects the known unsafe package defects.
          python3 -I scripts/selftest-verify-deb.py --scheme rootless --version "$VERSION" \
            "dist/DuoBar_${FILE_VERSION}_Rootless.deb" | tee -a dist/verification.txt
          cd dist
          shasum -a 256 "DuoBar_${FILE_VERSION}_RootHide.deb" > SHA256SUMS-RootHide.txt
          shasum -a 256 "DuoBar_${FILE_VERSION}_Rootless.deb" > SHA256SUMS-Rootless.txt
          cat SHA256SUMS-RootHide.txt SHA256SUMS-Rootless.txt

      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs from a failed build (no packages)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}-FAILED-logs
          path: |
            dist/*.log
            dist/*.txt
          if-no-files-found: ignore
          retention-days: 30

  publish:
    name: Publish a GitHub release for a beta tag or manual request
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v2.7.2-beta.') ||
      (github.event_name == 'workflow_dispatch' && (inputs.publish_prerelease || inputs.publish_stable))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
      FILE_VERSION: ${{ needs.build.outputs.file_version }}
      STABLE: ${{ needs.build.outputs.stable }}
      WANT_STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish the verified packages without replacing an existing release
        shell: bash
        run: |
          set -euo pipefail
          # A stable release needs both a stable version and an explicit
          # publish_stable request; everything else is a beta prerelease.
          if [ "$WANT_STABLE" = true ]; then
            [ "$STABLE" = true ] || { echo "::error::$TAG is a beta; refusing a stable release."; exit 1; }
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            kind=(--latest)
            title="DuoBar $TAG (RootHide + Rootless)"
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
            kind=(--prerelease --latest=false)
            title="DuoBar ${TAG%-beta.*} Beta ${TAG##*.} (RootHide + Rootless)"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # A pushed tag must name the version that was built and verified.
            test "$GITHUB_REF_NAME" = "$TAG"
            target=(--verify-tag)
          else
            # A manual run creates the tag at the commit that was verified.
            target=(--target "$GITHUB_SHA")
          fi
          notes="docs/RELEASE-$TAG.md"
          test -f "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to replace its packages."
            exit 1
          fi
          (cd dist && sha256sum -c SHA256SUMS-RootHide.txt SHA256SUMS-Rootless.txt)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${target[@]}" "${kind[@]}" \
            --title "$title" --notes-file "$notes" \
            "dist/DuoBar_${FILE_VERSION}_RootHide.deb" dist/SHA256SUMS-RootHide.txt \
            "dist/DuoBar_${FILE_VERSION}_Rootless.deb" dist/SHA256SUMS-Rootless.txt
