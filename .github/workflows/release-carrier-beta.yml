name: Build and publish DuoBar carrier beta (RootHide)

on:
  push:
    branches:
      - feature/carrier-5g-lte-v2.7.2-beta1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish RootHide beta package
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: brew install make ldid dpkg gnu-tar xz rsync

      - name: Configure Theos
        run: |
          echo "THEOS=$RUNNER_TEMP/duobar-theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Fetch RootHide Theos and iOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/duobar-sdks"
          git -C "$RUNNER_TEMP/duobar-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"

      - name: Build and verify the RootHide package
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DUO_VERSION @"2.7.2-beta.1"' Shared/DuoMetadata.h
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:16.5:16.0
          files=(packages/*.deb)
          test "${#files[@]}" -eq 1
          deb="${files[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = local.duobar
          test "$(dpkg-deb -f "$deb" Version)" = '2.7.2~beta1'
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          dpkg-deb --contents "$deb" | tee contents.txt
          grep -Fq 'Library/MobileSubstrate/DynamicLibraries/DuoBar.dylib' contents.txt
          grep -Fq 'Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBarIcon.png' contents.txt
          grep -Fq 'Library/PreferenceLoader/Preferences/DuoBar.plist' contents.txt
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          root = Path("extracted/Library")
          bundle = root / "PreferenceBundles/DuoBarPrefs.bundle"
          spec = root / "PreferenceLoader/Preferences/DuoBar.plist"
          info = plistlib.loads((bundle / "Info.plist").read_bytes())
          assert info["CFBundleShortVersionString"] == "2.7.2"
          assert plistlib.loads(spec.read_bytes())["entry"]["icon"] == "DuoBar.png"
          assert (bundle / "DuoBarIcon.png").is_file()
          for name in ("DuoBar.png", "DuoBar@2x.png", "DuoBar@3x.png"):
              image = (bundle / name).read_bytes()
              assert image[:8] == bytes.fromhex("89504e470d0a1a0a") and image[25] == 6, name
          print("Validated RootHide package, Settings metadata, and icons")
          PY
          cp "$deb" DuoBar_2.7.2-beta1_RootHide.deb
          shasum -a 256 DuoBar_2.7.2-beta1_RootHide.deb > SHA256SUMS-RootHide.txt

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.2-beta.1
          target_commitish: ${{ github.sha }}
          name: DuoBar v2.7.2 Beta 1 (RootHide)
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            RootHide test build based on the v2.7.1 release.

            This beta draws the compact 5G/LTE carrier label inside DuoBar in app status bars and Control Center. The Wi-Fi and Personal Hotspot marks remain in the ring, and the released settings, size slider, battery percentage, cellular dots, and Control Center behavior are retained.

            Install the attached `DuoBar_2.7.2-beta1_RootHide.deb` with a RootHide-compatible package manager and respring. Use `docs/TEST-v2.7.2-beta1.md` for the device checks. Compilation and package contents are verified; live iPhone behavior still needs testing.

            Rootless packaging and the stable/Sileo release are deferred until this RootHide beta is tested.
          files: |
            DuoBar_2.7.2-beta1_RootHide.deb
            SHA256SUMS-RootHide.txt
