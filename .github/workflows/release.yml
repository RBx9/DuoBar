name: Publish DuoBar release

on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v0.2.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release files
        uses: actions/checkout@v4
      - name: Verify RootHide installer
        run: |
          echo '6e50eb08bbf7babb3996504c23bb1d22b4e97d542e1809fec64eb43458f80781  downloads/DuoBar_0.2.0_RootHide.deb' | sha256sum --check -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 downloads/DuoBar_0.2.0_RootHide.deb \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DuoBar v0.2.0" \
            --notes-file docs/RELEASE-v0.2.0.md \
            --latest
