name: DuoBar simulator checks

# Simulator-only evidence; nothing here is packaged or published. Probes the
# private status-bar classes and selectors DuoBar uses on each available iOS
# simulator runtime, renders DuoBar in Settings and on the Home Screen, and
# traces it in SpringBoard while Control Center opens and closes. iOS 16 uses
# the release gate; newer runtimes use a simulator-only build with the gate
# raised, to evaluate them without changing what the packages support.
on:
  push:
    branches:
      - claude/duobar-development-2iw4np
    paths:
      - 'Sources/**'
      - 'Shared/**'
      - 'tests/simulator/**'
      - '.github/workflows/simulator-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator probe (${{ matrix.image }})
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: [macos-latest, macos-15]
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode and installed simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      # The macOS 15 image's Xcode can still install the iOS 16.4 and 17.5
      # simulator runtimes; newer images cannot.
      - name: Install the iOS 16.4 and 17.5 simulator runtimes
        if: matrix.image == 'macos-15'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          for version in 16.4 17.5; do
            { xcodebuild -downloadPlatform iOS -buildVersion "$version" 2>&1 ||
                echo "::warning::iOS $version simulator runtime could not be installed on this image"; } |
              grep -v 'Downloading .*%' || true
          done
          xcrun simctl list runtimes

      - name: Build simulator test dylibs
        run: tests/simulator/build.sh "$RUNNER_TEMP/sim"

      - name: Prepare image tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow

      - name: Probe, render and trace
        run: tests/simulator/run.sh "$RUNNER_TEMP/sim" "$RUNNER_TEMP/venv/bin/python"

      - name: Upload contact sheets and probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ matrix.image }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sim/sheet-*.png
            ${{ runner.temp }}/sim/shots/*.txt
            ${{ runner.temp }}/sim/shots/*.summary
          if-no-files-found: ignore
          retention-days: 30
