name: Verify DuoBar Rootless iOS 16

on:
  push:
    branches:
      - feature/rootless-package-v0.2.3
    paths:
      - '.github/workflows/verify-rootless.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rootless:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install required build tools
        run: brew install make ldid dpkg gnu-tar xz rsync
      - name: Configure Theos
        run: |
          echo "THEOS=$RUNNER_TEMP/duobar-theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Fetch standard Theos and iOS 16.5 SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/duobar-sdks"
          git -C "$RUNNER_TEMP/duobar-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build and inspect Rootless .deb
        shell: bash
        run: |
          set -euo pipefail
          cp packaging/control.rootless control
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64 TARGET=iphone:clang:16.5:16.0
          files=(packages/*.deb)
          test "${#files[@]}" -eq 1
          deb="${files[0]}"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = local.duobar.rootless
          test "$(dpkg-deb -f "$deb" Version)" = 0.2.3
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64
          dpkg-deb --contents "$deb" | tee package-contents.txt
          grep -Fq 'var/jb/Library/MobileSubstrate/DynamicLibraries/DuoBar.dylib' package-contents.txt
          grep -Fq 'var/jb/Library/PreferenceBundles/DuoBarPrefs.bundle/' package-contents.txt
          grep -Fq 'var/jb/Library/PreferenceLoader/Preferences/DuoBar.plist' package-contents.txt
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path("extracted/var/jb/Library")
          assert (root/"MobileSubstrate/DynamicLibraries/DuoBar.dylib").is_file()
          assert (root/"PreferenceBundles/DuoBarPrefs.bundle/DuoBarIcon.png").is_file()
          assert (root/"PreferenceBundles/DuoBarPrefs.bundle/DuoBar.png").is_file()
          plist = root/"PreferenceLoader/Preferences/DuoBar.plist"
          assert plistlib.loads(plist.read_bytes())["entry"]["icon"] == "DuoBar.png"
          print("Rootless installation prefix and Settings icon verified")
          PY
          cp "$deb" DuoBar_0.2.3_Rootless.deb
          shasum -a 256 DuoBar_0.2.3_Rootless.deb | tee SHA256SUMS-rootless.txt
      - name: Upload Rootless package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: DuoBar-v0.2.3-rootless-test
          path: |
            DuoBar_0.2.3_Rootless.deb
            SHA256SUMS-rootless.txt
          if-no-files-found: error
