name: Verify DuoBar 0.2.1 Settings

on:
  push:
    branches: [fix/control-center-battery-layout]
    paths:
      - '.github/workflows/verify-settings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-root-hide:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install make ldid dpkg gnu-tar xz rsync
      - name: Configure toolchain
        run: |
          echo 'THEOS=$RUNNER_TEMP/duobar-theos' >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Fetch Theos and SDK
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/duobar-sdks"
          git -C "$RUNNER_TEMP/duobar-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Compile and verify package
        run: |
          set -euo pipefail
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:16.5:16.0
          files=(packages/*.deb)
          test "${#files[@]}" -eq 1
          deb="${files[0]}"
          test "$(dpkg-deb -f "$deb" Version)" = '0.2.1'
          test "$(dpkg-deb -f "$deb" Architecture)" = 'iphoneos-arm64e'
          test "$(dpkg-deb -f "$deb" Package)" = 'local.duobar'
          dpkg-deb --contents "$deb" | tee package-contents.txt
          grep -Fq 'Library/PreferenceLoader/Preferences/DuoBar.png' package-contents.txt
          grep -Fq 'Library/PreferenceLoader/Preferences/DuoBar@2x.png' package-contents.txt
          grep -Fq 'Library/PreferenceLoader/Preferences/DuoBar@3x.png' package-contents.txt
          grep -Fq 'Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBarIcon.png' package-contents.txt
          dpkg-deb --extract "$deb" buildcheck
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          base = Path('buildcheck/Library/PreferenceLoader/Preferences/DuoBar.plist')
          data=plistlib.loads(base.read_bytes())
          assert data['entry']['icon'] == 'DuoBar.png'
          icon=Path('buildcheck/Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBarIcon.png')
          assert icon.is_file()
          print('Settings assets and PreferenceLoader icon verified')
          PY
      - name: Upload compiled RootHide installer
        uses: actions/upload-artifact@v4
        with:
          name: DuoBar-0.2.1-test-roothide
          path: packages/*.deb
          if-no-files-found: error
