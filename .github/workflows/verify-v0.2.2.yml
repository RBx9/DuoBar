name: Verify DuoBar v0.2.2 icon

on:
  push:
    branches: [fix/settings-icon-v0.2.2]
    paths: ['.github/workflows/verify-v0.2.2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install make ldid dpkg gnu-tar xz rsync
      - name: Configure Theos
        run: |
          echo "THEOS=$RUNNER_TEMP/duobar-theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Download RootHide Theos and SDK
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/duobar-sdks"
          git -C "$RUNNER_TEMP/duobar-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/duobar-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
      - name: Build verified stable RootHide installer
        shell: bash
        run: |
          set -euo pipefail
          gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide TARGET=iphone:clang:16.5:16.0
          files=(packages/*.deb)
          test "${#files[@]}" -eq 1
          deb="${files[0]}"
          test "$(dpkg-deb -f "$deb" Package)" = "local.duobar"
          test "$(dpkg-deb -f "$deb" Version)" = "0.2.2"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
          dpkg-deb --contents "$deb" | tee contents.txt
          grep -Fq 'Library/PreferenceLoader/Preferences/DuoBar.png' contents.txt
          grep -Fq 'Library/PreferenceLoader/Preferences/DuoBar@2x.png' contents.txt
          grep -Fq 'Library/PreferenceLoader/Preferences/DuoBar@3x.png' contents.txt
          grep -Fq 'Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBarIcon.png' contents.txt
          grep -Fq 'Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBar.png' contents.txt
          grep -Fq 'Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBar@2x.png' contents.txt
          grep -Fq 'Library/PreferenceBundles/DuoBarPrefs.bundle/DuoBar@3x.png' contents.txt
          dpkg-deb --extract "$deb" extracted
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          root = Path('extracted/Library/PreferenceBundles/DuoBarPrefs.bundle')
          assert (root/'DuoBar.png').is_file()
          assert (root/'DuoBar@2x.png').is_file()
          assert (root/'DuoBar@3x.png').is_file()
          spec=Path('extracted/Library/PreferenceLoader/Preferences/DuoBar.plist')
          assert plistlib.loads(spec.read_bytes())['entry']['icon'] == 'DuoBar.png'
          print('PreferenceLoader icon and bundle assets verified')
          PY
          cp "$deb" DuoBar_0.2.2_RootHide.deb
          shasum -a 256 DuoBar_0.2.2_RootHide.deb > SHA256SUMS.txt
      - name: Upload verified test installer
        uses: actions/upload-artifact@v4
        with:
          name: DuoBar-v0.2.2-icon-test
          path: DuoBar_0.2.2_RootHide.deb
          if-no-files-found: error
