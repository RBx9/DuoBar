name: Build experimental YouTubeLegacy Subscribe fix
on:
  push:
    branches:
      - experiment/ytlegacy-subscribe-20261031
    paths:
      - 'ytlegacy-experiment/**'
      - '.github/workflows/ytlegacy-subscribe-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rootful-deb:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install make ldid dpkg gnu-tar xz rsync
      - name: Configure toolchain
        run: |
          echo "THEOS=$RUNNER_TEMP/ytlegacy-theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Install Theos and iOS SDK
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/ytlegacy-sdks"
          git -C "$RUNNER_TEMP/ytlegacy-sdks" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R "$RUNNER_TEMP/ytlegacy-sdks/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          git clone --depth 1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          git clone --depth 1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
      - name: Clone upstream source and apply experimental fix
        run: |
          git clone --depth 1 https://github.com/PoomSmart/YouTubeLegacy.git upstream
          cp ytlegacy-experiment/SubscriptionFix.x upstream/SubscriptionFix.x
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/Makefile')
          s=p.read_text()
          lines=s.splitlines()
          for i,l in enumerate(lines):
              if l.startswith('$(TWEAK_NAME)_FILES = '):
                  lines[i]+=' SubscriptionFix.x'
                  break
          else:
              raise RuntimeError('Source layout changed: no TWEAK_NAME_FILES')
          p.write_text('\n'.join(lines)+'\n')
          PY
          cat upstream/Makefile
      - name: Build rootful package for iOS 14
        run: |
          gmake -C upstream clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME= TARGET=iphone:clang:16.5:11.0
          for package in upstream/packages/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - name: Save .deb
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeLegacy-Subscribe-Experimental-iOS14-rootful
          path: upstream/packages/*.deb
          if-no-files-found: error
