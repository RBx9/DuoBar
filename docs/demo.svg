<title id="title">DuoBar by RBx9 — circular battery, Wi-Fi and cellular status bar</title>
<desc id="desc">An illustrative before-and-after status-bar design preview in light and dark appearances. DuoBar combines battery percentage and side arcs, Wi-Fi in the center, and four separate cellular dots below. Battery examples show normal fifty percent, low battery sixteen percent, charging eighty percent, and Low Power Mode sixty percent. A settings switch illustration shows Enable DuoBar. This is not a device screenshot; example values are illustrative.</desc>
